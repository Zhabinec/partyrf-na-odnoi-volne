<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b29">
  <title>На одной волне — игра для компании</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header class="masthead">
    <a href="./" class="wordmark" aria-label="На одной волне, главная">
      <span class="signal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12c3-8 6-8 9 0s6 8 9 0"/></svg></span>
      <span>На одной волне</span>
    </a>
    <span class="badge" id="room-label">ИГРА ДЛЯ КОМПАНИИ</span>
    <details class="header-menu" id="header-menu">
      <summary class="menu-toggle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        Меню
      </summary>
      <div class="menu-panel">
        <a id="display-link" class="header-button" target="_blank" rel="noopener" hidden>Открыть общий экран</a>
        <button type="button" class="header-button" id="sound-toggle" aria-haspopup="dialog" aria-controls="sound-settings">Звук</button>
        <button type="button" class="header-button" id="leave-room" hidden>Выйти из комнаты</button>
      </div>
    </details>
  </header>
  <dialog id="sound-settings" class="sound-settings" aria-labelledby="sound-title">
    <h2 id="sound-title">Настройки звука</h2>
    <label for="music-level">Музыка <span id="music-value" aria-hidden="true">100%</span></label>
    <input id="music-level" type="range" min="0" max="100" value="100" autofocus>
    <label for="effects-level">Звуковые эффекты <span id="effects-value" aria-hidden="true">100%</span></label>
    <input id="effects-level" type="range" min="0" max="100" value="100">
    <form method="dialog"><button>Готово</button></form>
  </dialog>
  <main id="app" class="stage"></main>
  <p id="feedback" class="feedback" role="status" hidden></p>
  <footer class="footer">ПРИДУМАЙ ТЕМУ <span>·</span> ПОЙМАЙ ВОЛНУ <span>·</span> УДИВИСЬ ОТВЕТУ</footer>
  <p class="footer">Музыка · <a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1700018" target="_blank" rel="noopener">Surf Shimmy — Kevin MacLeod</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></p>
</body>
</html>
